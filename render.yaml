databases:
  - name: departement-communication-db
    databaseName: departement_communication
    user: dcub
    plan: free
    region: frankfurt

services:
  - type: web
    name: departement-de-communicaton
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://departement-de-communicaton.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: departement-communication-db
          property: connectionString
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_DRIVER
        value: auto
      - key: REQUIRE_APPROVAL
        value: "1"
      - key: REGISTRATION_OPEN
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "8"
